<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPAGrip - Offer Directory & Tools</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="dashboard-body bg-[#f1f5f9] text-[#1e293b] font-sans antialiased text-xs">

  <!-- Top Header -->
  <header class="h-14 bg-[#111726] border-b border-gray-800 text-white px-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="flex items-center gap-2">
        <span class="text-xl font-black tracking-tight text-white font-mono flex items-center">
          <span class="text-emerald-400 mr-1"><i class="fa-solid fa-money-bill-wave"></i></span>
          CPAGRIP
        </span>
      </a>
      <span class="text-gray-400">|</span>
      <span class="text-xs text-gray-300 font-semibold">Offer Tools & Directory</span>
    </div>

    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Dashboard</span>
      </a>
      <a href="lockers.html" class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-lock"></i>
        <span>Lockers</span>
      </a>
    </div>
  </header>

  <!-- Main Offers Workspace -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">
    
    <div class="flex items-center justify-between">
      <div>
        <span class="text-gray-400 text-xs">Home / Offer Tools /</span>
        <h1 class="text-xl font-bold text-gray-800 inline-block ml-1">My Offers</h1>
      </div>
      <span class="text-xs font-mono text-gray-500">Live Database: <strong class="text-orange-600 font-bold">3,248 Active Campaigns</strong></span>
    </div>

    <!-- Filter Card -->
    <div class="cpagrip-card p-4 space-y-3">
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Search Keyword</label>
          <input type="text" id="offer-search-input" placeholder="e.g. PayPal, Gaming, TikTok..." class="w-full bg-white border border-gray-300 rounded px-2.5 py-1.5 text-xs text-gray-800 focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Country Filter</label>
          <select id="offer-country-select" class="w-full bg-white border border-gray-300 rounded px-2.5 py-1.5 text-xs text-gray-800 focus:outline-none focus:border-orange-500">
            <option value="ALL">🌍 Global & All Countries</option>
            <option value="US">🇺🇸 United States</option>
            <option value="UK">🇬🇧 United Kingdom</option>
            <option value="CA">🇨🇦 Canada</option>
            <option value="AU">🇦🇺 Australia</option>
            <option value="DE">🇩🇪 Germany</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Vertical Category</label>
          <select onchange="setOfferCategory(this.value)" class="w-full bg-white border border-gray-300 rounded px-2.5 py-1.5 text-xs text-gray-800 focus:outline-none focus:border-orange-500">
            <option value="all">All Verticals</option>
            <option value="Sweepstakes">Sweepstakes & Vouchers</option>
            <option value="Finance">Finance & Rewards</option>
            <option value="Gaming">Gaming & Apps</option>
            <option value="Mobile CPI">Mobile Installs</option>
            <option value="Surveys">Surveys & Opinions</option>
            <option value="Crypto">Crypto</option>
          </select>
        </div>
      </div>

      <!-- Quick Category Pills -->
      <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t border-gray-100">
        <span class="text-[10px] font-bold text-gray-400 font-mono uppercase mr-1">Quick Select:</span>
        <button onclick="setOfferCategory('all', this)" class="cat-pill bg-orange-500 text-white font-bold text-[11px] px-3 py-1 rounded">All</button>
        <button onclick="setOfferCategory('Sweepstakes', this)" class="cat-pill bg-gray-100 text-gray-700 hover:text-black text-[11px] px-3 py-1 rounded">🎁 Sweepstakes</button>
        <button onclick="setOfferCategory('Finance', this)" class="cat-pill bg-gray-100 text-gray-700 hover:text-black text-[11px] px-3 py-1 rounded">💳 Finance</button>
        <button onclick="setOfferCategory('Gaming', this)" class="cat-pill bg-gray-100 text-gray-700 hover:text-black text-[11px] px-3 py-1 rounded">🎮 Gaming</button>
        <button onclick="setOfferCategory('Mobile CPI', this)" class="cat-pill bg-gray-100 text-gray-700 hover:text-black text-[11px] px-3 py-1 rounded">📱 Mobile CPI</button>
        <button onclick="setOfferCategory('Surveys', this)" class="cat-pill bg-gray-100 text-gray-700 hover:text-black text-[11px] px-3 py-1 rounded">📊 Surveys</button>
        <button onclick="setOfferCategory('Crypto', this)" class="cat-pill bg-gray-100 text-gray-700 hover:text-black text-[11px] px-3 py-1 rounded">⚡ Crypto</button>
      </div>

    </div>

    <!-- Offers Table Card (CPAGrip Table Style) -->
    <div class="cpagrip-card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left cpagrip-table">
          <thead>
            <tr>
              <th>Offer ID</th>
              <th>Campaign Name & Type</th>
              <th>Category</th>
              <th>Target Geos</th>
              <th>EPC</th>
              <th>Payout</th>
              <th class="text-right">Action</th>
            </tr>
          </thead>
          <tbody id="offers-table-body" class="font-mono text-gray-700">
            <!-- Dynamically populated via app.js -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Offer Details Modal -->
  <div id="offer-details-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-md bg-white rounded-lg border border-gray-300 p-6 shadow-2xl space-y-4">
      <button onclick="closeOfferModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div>
        <span id="modal-offer-id" class="text-[10px] font-mono text-orange-600 font-bold bg-orange-100 px-2 py-0.5 rounded"></span>
        <h3 id="modal-offer-title" class="text-base font-bold text-gray-900 mt-2"></h3>
        <span id="modal-offer-category" class="text-xs text-gray-500 block mt-0.5"></span>
      </div>

      <div class="grid grid-cols-2 gap-3 bg-gray-50 p-3 rounded border border-gray-200 text-center font-mono text-xs">
        <div>
          <span class="text-gray-500 block text-[10px]">PAYOUT</span>
          <span id="modal-offer-payout" class="font-bold text-orange-600 text-sm"></span>
        </div>
        <div>
          <span class="text-gray-500 block text-[10px]">AVG EPC</span>
          <span id="modal-offer-epc" class="font-bold text-blue-600 text-sm"></span>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-800">Your Unique Tracking Link</label>
        <div class="flex items-center gap-2">
          <input type="text" id="modal-tracking-link" readonly class="w-full bg-gray-100 border border-gray-300 rounded px-2.5 py-1.5 text-xs font-mono text-gray-900 select-all">
          <button onclick="copyTrackingLink()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs px-3 py-1.5 rounded shrink-0">
            Copy
          </button>
        </div>
        <p class="text-[10px] text-gray-500">Supports parameters: <code>{sub1}</code>, <code>{sub2}</code>, <code>{click_id}</code></p>
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="closeOfferModal()" class="text-xs text-gray-600 hover:text-black font-semibold px-3 py-1.5">Close</button>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
